# Netlify configuration for the frontend.
#
# Netlify serves the built SPA only. The Flask + TensorFlow backend is a
# stateful Python process and cannot run here — it currently runs locally
# and is exposed via a free Cloudflare Quick Tunnel (trycloudflare.com).
#
# IMPORTANT: Quick Tunnel URLs are ephemeral — no uptime guarantee, and the
# URL changes every time the tunnel process restarts. This only stays live
# while the local machine + `cloudflared tunnel --url http://localhost:5000`
# process are running. For a permanent URL, move to a real host (Render,
# Railway, Fly.io) and update the redirect target below.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- API routing ---------------------------------------------------------
#
# Proxied to the local backend via Cloudflare Quick Tunnel. The browser sees
# a single origin so CORS never enters the picture.
[[redirects]]
  from   = "/api/*"
  to     = "https://ser-grammar-follows-extensive.trycloudflare.com/api/:splat"
  status = 200
  force  = true

# SPA fallback: every non-asset path is handled by React Router. Must come
# after the API rule, or it would swallow /api requests too.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints asset filenames, so they are safe to cache forever.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
